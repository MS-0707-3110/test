name: 山梨県土地情報 自動更新

on:
  schedule:
    # 毎日 00:00 JST = 15:00 UTC に実行
    - cron: '0 15 * * *'
  workflow_dispatch:   # 手動実行も可能

permissions:
  contents: write      # Excelファイルのコミット・プッシュに必要

jobs:
  update-land-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/land-search-tracker-sIxzu

      - name: Python 環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: land-search/requirements.txt

      - name: 依存パッケージをインストール
        run: pip install -r land-search/requirements.txt

      - name: 土地情報を収集・Excel 更新
        run: |
          cd land-search
          python main.py --no-git
        env:
          PYTHONIOENCODING: utf-8

      - name: 変更があればコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add land-search/data/山梨土地情報.xlsx
          if git diff --cached --quiet; then
            echo "変更なし（新規物件なし）"
          else
            git commit -m "🏡 [自動更新] 山梨土地情報 $(date '+%Y-%m-%d %H:%M JST' -d '+9 hours')"
            git push origin claude/land-search-tracker-sIxzu
            echo "プッシュ完了"
          fi
